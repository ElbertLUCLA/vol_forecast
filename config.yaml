# Central configuration for the SPY realized-volatility data pipeline.
# See plan.md for the full rationale behind these choices.

ticker: SPY

paths:
  raw_5min_dir: data/raw/spy_5min
  raw_daily_path: data/raw/spy_daily/spy_daily_raw.parquet
  ingest_log_path: data/raw/ingest_log.csv
  interim_5min_rth_path: data/interim/spy_5min_rth.parquet
  calendar_path: data/interim/trading_calendar.parquet
  daily_measures_path: data/processed/spy_daily_measures.parquet
  features_path: data/processed/spy_features.parquet
  splits_dir: data/processed/splits
  forecasts_dir: data/processed/forecasts
  qc_dir: reports/qc

massive_api:
  base_url: https://api.massive.com/v2/aggs/ticker
  minute_multiplier: 5
  minute_timespan: minute
  day_timespan: day
  limit: 50000
  adjusted: true
  max_retries: 5
  backoff_base_seconds: 1.0

sample_period:
  download_start: "2004-01-01"
  download_end: "2026-09-30"
  modelling_start: "2004-01-02"

calendar:
  exchange: NYSE
  bar_minutes: 5
  # Drop a day if more than this fraction of its intraday grid is missing.
  max_missing_fraction: 0.10

realized_measures:
  # Floor applied to RV / RS- before taking logs, as a percentile of training RV.
  zero_rv_floor_percentile: 0.001

features:
  base_windows:
    daily: 1
    weekly: 5
    monthly: 22
  horizons: [1, 5, 22]

har_lags: [1, 5, 22]

events:
  covid:
    peak: "2020-02-19"
    trough: "2020-03-23"
    analysis_window: ["2019-07-01", "2020-06-30"]
    train_end: "2019-12-31"
    pre_event_window: ["2020-01-02", "2020-02-19"]
    event_window: ["2020-02-20", "2020-03-23"]
    post_event_window: ["2020-03-24", "2020-06-30"]
  bear2022:
    peak: "2022-01-03"
    trough: "2022-10-12"
    analysis_window: ["2021-07-01", "2023-03-31"]
    train_end: "2021-09-30"
    pre_event_window: ["2021-10-01", "2022-01-03"]
    event_window: ["2022-01-04", "2022-10-12"]
    post_event_window: ["2022-10-13", "2023-03-31"]

sequence_view:
  lags: 10
